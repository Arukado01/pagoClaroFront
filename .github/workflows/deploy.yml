name: Deploy frontend demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: payment-demo-front
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.EC2_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy and wait for health check
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "commands=/usr/local/bin/deploy-payment-demo front $GITHUB_SHA" --query 'Command.CommandId' --output text)
          for i in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in Success) exit 0;; Failed|Cancelled|TimedOut|Cancelling) echo "Deploy failed: $status"; exit 1;; esac
            sleep 10
          done
          echo 'Deploy did not finish in time'; exit 1
